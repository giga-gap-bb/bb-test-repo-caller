name: Evil Claims Inspector
on:
  workflow_call:
permissions:
  id-token: write
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Decode claims in foreign reusable context
        shell: bash
        run: |
          TOKEN=$(curl -s "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo $TOKEN | cut -d. -f2 | python3 -c "import sys,base64;s=sys.stdin.read().strip();s+='='*(-len(s)%4);print(base64.urlsafe_b64decode(s).decode())")
          echo "CLAIMS_IN_REUSABLE_START"
          echo "$PAYLOAD" | python3 -m json.tool
          echo "CLAIMS_IN_REUSABLE_END"
